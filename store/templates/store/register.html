


<!DOCTYPE html>
<html>
<head>
    <title>Register - FreshBasket</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f8f5;
            margin: 0;
            padding: 0;
        }

        .container {
            width: 320px;
            margin: 80px auto;
            background: white;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 2px 8px #ddd;
        }

        h2 {
            text-align: center;
            color: green;
        }

        p {
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            margin-bottom: 12px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 10px;
            background: green;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: darkgreen;
        }

        .helptext {
    display: none;
}

ul {
    display: none;
}

.container {
    width: 300px;
    margin: 60px auto;
    padding: 20px;
}
    </style>
</head>

<body>

<div class="container">

    <h2>FreshBasket</h2>
    <p style="text-align:center;">Create Your Account</p>

    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}

        <button type="submit">Register</button>
    </form>

    <p style="text-align:center;">
    Already have an account?
    <a href="{% url 'login' %}">Login</a>
</p>

</div>

</body>
</html>
